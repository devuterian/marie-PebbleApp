#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6g
kotlin.native.jvmArgs=-Xmx12g
ksp.useKSP2=true
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true
# atomicfu's bytecode transform task has no hook on AGP 9's KMP android target; the compiler
# plugin does the same job.
kotlinx.atomicfu.enableJvmIrTransformation=true

#Gradle
org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true

#Android
kotlin.incremental.native=true
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.mpp.enableCInteropCommonization=true

org.gradle.configuration-cache=true

